name: "Release"

on:
  push:
    tags:
      - "v*"
  # auto-tag.yml pushes its tag with the default GITHUB_TOKEN, and GitHub
  # deliberately never starts new workflow runs from events created by that
  # token -- EXCEPT workflow_dispatch/repository_dispatch. So auto-tag
  # explicitly dispatches this workflow on the new tag's ref instead of
  # relying on the tag push. When running it by hand from the Actions UI,
  # pick the tag (not a branch) as the ref -- every step below resolves the
  # release version from the ref it runs on.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"
        with:
          # Full history + tags, not just the tagged commit -- the changelog
          # script below needs to walk commits back to the previous tag.
          fetch-depth: 0

      - name: "Adjust version number"
        shell: "bash"
        run: |
          version="${GITHUB_REF_NAME#v}"
          yq -i -o json ".version=\"${version}\"" \
            "${GITHUB_WORKSPACE}/custom_components/nearby_flights/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${GITHUB_WORKSPACE}/custom_components/nearby_flights"
          zip nearby_flights.zip -r ./

      - name: "Build the changelog"
        shell: "bash"
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/build_changelog.py" > "${GITHUB_WORKSPACE}/changelog.md"

      - name: "Create the release and upload the ZIP file"
        uses: softprops/action-gh-release@v3
        with:
          # The dashboard cards ship alongside the integration zip: HACS only
          # installs custom_components, so manually-copied cards would
          # otherwise silently drift from the backend schema across releases.
          files: |
            ${{ github.workspace }}/custom_components/nearby_flights/nearby_flights.zip
            ${{ github.workspace }}/www/flight-panel-card.js
            ${{ github.workspace }}/www/home-assistant-flightradar24-card-square.js
          body_path: ${{ github.workspace }}/changelog.md
