name: Code Checker
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run flake8
        run: flake8 .
      - name: Run tests
        # The suite imports the api/ package standalone (see tests/conftest.py),
        # so no homeassistant install is needed here.
        run: pytest tests/ -v
